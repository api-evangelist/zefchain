entries:
  - version: 0.15.19
    highlights:
      - Multi-leader jitter fixes and chain-manager improvements.
      - Support splitting a Linera block into multiple EVM transactions.
      - ScyllaDB performance and bridge optimizations.
  - version: 0.15.17
    highlights:
      - EVM-to-Linera fungible bridge and bridge demo.
      - Prometheus metrics for Wasm bytecode sizes.
      - New validator endpoint for previous_event_blocks.
  - version: 0.15.15
    highlights:
      - Sparse event-chain support.
      - Improved GraphQL subscription handling via watch channels.
  - version: 0.15.14
    highlights:
      - Linera protocol verification in Solidity; enhanced bridge testing.
      - LRU response caching for application GraphQL queries.
  - version: 0.15.13
    highlights:
      - Generic benchmark operation generation.
      - Pyroscope profile-forwarding observability support.
  - version: 0.15.12
    highlights:
      - Web storage implementation and wallet locking on the Web platform.
      - serde-reflection tracking of BCS formats for application data.
