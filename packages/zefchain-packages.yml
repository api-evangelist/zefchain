name: Linera (Zefchain) Client Libraries
description: >-
  First-party client libraries published by Zefchain Labs / linera-io for
  building applications on the Linera protocol. Rust crates are the primary
  developer surface (published to crates.io by the linera-io team); a set of
  scoped @linera npm packages provide the web/browser client and wallet
  integrations.
