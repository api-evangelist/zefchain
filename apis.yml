apis:
- name: Linera Node Service (GraphQL)
  description: >-
    GraphQL API exposed by the Linera node service (run via the linera CLI)
    that lets web frontends read and mutate the state of the microchains held
    by a wallet, including GraphQL subscriptions for chain events. Self-hosted;
    authorized by cryptographic wallet signatures rather than OAuth.
