name: Zefchain
description: >-
  Zefchain Labs is the company behind Linera, a decentralized Web3 protocol
  designed for highly scalable, low-latency applications using a "microchain"
  architecture in which each user or application runs its own lightweight chain.
  Developers build applications in Rust with the open-source Linera SDK, deploy
  them to a public Testnet, and expose chain state to web frontends through a
  GraphQL node service. Zefchain also operates Linera Markets, a 24/7 on-chain
  trading platform. The project (formerly branded Zefchain) is developed in the
  open at github.com/linera-io under Apache-2.0 and is backed by a16z. This
  profile was enriched by the API Evangelist pipeline from public sources.
